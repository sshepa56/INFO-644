const map = document.getElementById("nyc-layered-map");
const panel = document.getElementById("pie-panel");

map.on("plotly_hover", function(event) {

    const point = event.points[0];

    // District mortality polygon or label
    if (![1, 3].includes(point.curveNumber)) return;

    if (!point.customdata) return;

    const cd = String(point.customdata[0]).trim();
    const data = pieData[cd];

    if (!data) return;

    document.getElementById("pie-title").textContent =
        "Community District " + cd;

    document.getElementById("pie-note").textContent =
        "2023 categorized deaths: " +
        data.total.toLocaleString();

    panel.style.display = "block";

    Plotly.react("pie-chart", [{
        type: "pie",
        labels: data.labels,
        values: data.values,
        hole: 0.2,
        sort: false,
        marker: {
            colors: data.colors
        },
        textinfo: "percent",
        textposition: "inside",
        hovertemplate:
            "<b>%{label}</b><br>" +
            "Deaths: %{value:,.0f}<br>" +
            "Share: %{percent}<extra></extra>",
        showlegend: false
    }], {
        margin: {l: 5, r: 5, t: 5, b: 5},
        height: 390,
        paper_bgcolor: "white"
    }, {
        responsive: true,
        displayModeBar: false
    });
});

document.getElementById("close-pie").onclick =
    function() {
        panel.style.display = "none";
    };
</script>
